name: Frontend CI

on:
  push:
    branches: [master, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  # No path filter on pull requests: a workflow that is skipped by a path filter never reports its
  # checks, and a required check that never reports blocks the merge forever (docs-only changes).
  # The `changes` job below does the filtering instead, and a job skipped by `if` counts as passed.
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A push only reaches this workflow when its path filter matched, so it is always relevant.
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(frontend/|\.github/workflows/frontend-ci\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint, type-check, test, build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"

  security:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only what ships is scanned. The remaining findings are in the lint tooling (eslint-config-next,
      # fast-glob, micromatch, braces) and braces has no fixed release yet (3.0.3 is the latest), so
      # `npm audit` would fail on code that never reaches users. Drop --omit=dev once braces is patched.
      - name: Dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # This job scans the whole repo, not just frontend/ — override the workflow's
    # frontend-scoped default so `gitleaks detect`'s --source . and its default
    # .gitleaksignore lookup (also relative to cwd) both resolve at the repo root.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file; update with the version.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact -v
