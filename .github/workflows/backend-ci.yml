name: Backend CI

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  # No path filter on pull requests: a workflow that is skipped by a path filter never reports its
  # checks, and a required check that never reports blocks the merge forever (docs-only changes).
  # The `changes` job below does the filtering instead, and a job skipped by `if` counts as passed.
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A push only reaches this workflow when its path filter matched, so it is always relevant.
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(backend/|\.github/workflows/backend-ci\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint, format, type-check, test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: trading_agent
          POSTGRES_USER: trading_agent
          POSTGRES_PASSWORD: trading_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy, strict)
        run: uv run mypy app

      - name: Test (pytest)
        run: uv run python -m pytest tests/ -v

  docker:
    name: Docker build and health check
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t trade-agent-api .

      - name: Start it and check /health
        run: |
          docker run -d --name api -p 8080:8080 trade-agent-api
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

  security:
    name: Dependency + code security scan
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run pip-audit

      - name: Security lint (bandit)
        run: uv run bandit -r app

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # This job scans the whole repo, not just backend/ — override the workflow's
    # backend-scoped default so `gitleaks detect`'s --source . and its default
    # .gitleaksignore lookup (also relative to cwd) both resolve at the repo root.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action now requires a paid GITLEAKS_LICENSE secret;
      # the underlying CLI is still free, so run it directly instead.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file; update with the version.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact -v
