name: Workflows CI

on:
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test Dependabot branch updater
        run: node --test .github/scripts/update-dependabot-prs.test.mjs

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
