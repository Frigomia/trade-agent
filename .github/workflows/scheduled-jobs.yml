name: Scheduled jobs

on:
  schedule:
    - cron: "30 5 * * *" # daily, UTC: portfolio snapshots, outcome evaluation, then (weekdays only) automatic analysis and Telegram messages
    - cron: "0 4 * * 0" # weekly, Sunday UTC: refresh the global-universe snapshot in Redis (discovery_snapshot)
  workflow_dispatch:
    inputs:
      job:
        description: Which scheduled command to run
        type: choice
        options: [daily, discovery_snapshot]
        default: daily

permissions:
  contents: read

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  daily:
    name: python -m app.scheduled (daily, or discovery_snapshot on the weekly schedule)
    runs-on: ubuntu-latest
    # Scheduled runs are always master; a manual dispatch from another branch must not use the production token.
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 75
    # Needs the GitHub Environment `production` (master only, holds the secrets): see docs/RUNBOOK.md.
    environment: production
    steps:
      - uses: actions/checkout@v7

      # The flyctl version is pinned and bumped by hand.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: "0.4.111"

      - name: Run the scheduled command in a one-off Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Sunday 04:00 runs the weekly snapshot, a manual run takes its input, anything else is the daily job.
          COMMAND: ${{ github.event.schedule == '0 4 * * 0' && 'discovery_snapshot' || inputs.job || 'daily' }}
        # `machine run` returns once the machine has started, not when the command ends, and with
        # `--rm` the exit code is gone with the machine. So the machine is kept, waited for, its exit
        # code read from its exit event, its log printed, and then it is destroyed. The step fails on a
        # non-zero exit or an out-of-memory kill. A command that exits quickly makes `machine run` itself
        # report a failed start; the machine id is still printed, so the exit code is read the same way.
        # APP_ENV is passed explicitly because `machine run` does not apply fly.toml [env]; without
        # it the production TLS guard would be off for this job.
        run: |
          set -uo pipefail
          APP=$(grep -m1 '^app = ' backend/fly.toml | cut -d'"' -f2)
          # The image the running machine uses, so the job always runs the deployed code.
          IMAGE=$(flyctl machine list --app "$APP" --json \
            | jq -r '[.[] | select(.state == "started")][0].config.image')
          if [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ]; then
            echo "no started machine found for app $APP; is the backend deployed?" >&2
            exit 1
          fi
          # The machine gets the app's secrets. Flags first, then `--`: flyctl's `-m` means --metadata,
          # so without the `--` it would swallow the `-m` of `python -m app.scheduled`.
          OUT=$(flyctl machine run --app "$APP" --region fra --restart no --vm-memory 1024 \
            --env APP_ENV=production "$IMAGE" -- python -m app.scheduled "$COMMAND" 2>&1) || RUN_STATUS=$?
          echo "$OUT"
          echo "machine run exit status: ${RUN_STATUS:-0}"
          ID=$(echo "$OUT" | awk '/Machine ID:/ {print $NF; exit}')
          if [ -z "$ID" ]; then
            echo "the machine was not created" >&2
            exit 1
          fi
          # GitHub runs this step with `bash -e`, so any later failure ends it: the trap still removes
          # the machine then.
          trap 'flyctl machine destroy "$ID" --app "$APP" --force || echo "could not remove machine $ID" >&2' EXIT
          # One hour is the job lock's lifetime (LOCK_SECONDS in app/scheduled.py).
          flyctl machine wait "$ID" --app "$APP" --state stopped --wait-timeout 1h || echo "timed out waiting for the job" >&2
          flyctl logs --app "$APP" --machine "$ID" --no-tail || true
          EXIT=$(flyctl machine list --app "$APP" --json \
            | jq -r --arg id "$ID" '[.[] | select(.id == $id) | .events[] | select(.type == "exit")][0] | if . == null then "no exit event" else "\(.request.exit_event.exit_code // 0) \(.request.exit_event.oom_killed // false)" end')
          echo "exit code and out-of-memory kill: $EXIT"
          [ "$EXIT" = "0 false" ]
