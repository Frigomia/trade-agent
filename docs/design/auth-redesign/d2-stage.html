<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 · The Stage · trade-agent sign-in</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="d.css">
<style>
/* D2 · THE STAGE. Mock, not the app. Structure changed from the reference: the form is the centre of the page,
   the product sits on both sides of it, cropped by the window edges like objects around a plinth; the promise
   is a line below. No icons in the fields. One column on a phone. */
.page { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: 28px clamp(20px, 4vw, 64px) 24px; overflow: hidden; }
.top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 3; }
.stage { position: relative; display: grid; place-items: center; padding: 20px 0 28px; }
.center { position: relative; z-index: 3; display: grid; justify-items: center; gap: 32px; width: 100%; }
.promise { margin: 0; text-align: center; font-size: clamp(18px, 1.6vw, 22px); line-height: 1.35; font-weight: 500; letter-spacing: -0.025em; color: var(--text2); max-width: 36ch; text-wrap: balance; }
.promise small { display: block; margin-top: 8px; font-size: 14px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.fl, .fr { position: absolute; z-index: 1; width: 380px; }
.fl { left: 32px; top: 14%; }
.fr { right: 32px; bottom: 10%; }
.sc { display: grid; grid-template-columns: 90px minmax(0, 1fr) 30px; gap: 12px; align-items: center; font-size: 13.5px; color: var(--text2); }
.sc .tr { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; } .sc .tr i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.sc .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; }
.rc2 h3 { margin: 0; font-size: 16px; font-weight: 650; } .rc2 .cap { font-size: 12.5px; color: var(--muted); }
.src { display: grid; gap: 6px; font-size: 13.5px; color: var(--text2); } .src b { color: var(--accent); font-weight: 600; margin-right: 8px; }
.legal { text-align: center; position: relative; z-index: 3; }
@media (max-width: 1319px) { .fl, .fr { display: none; } }
@media (max-width: 899px) { .center { gap: 24px; } .promise { order: -1; font-size: 17px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script src="d.js"></script>
<script>
var side2 = '<article class="rc rc2" aria-label="Illustrative scores and sources"><span class="ill">Illustrative example</span><h3>Computed scores</h3><span class="cap">Kept apart from the AI text</span>' +
  '<div class="sc"><span>Quality</span><span class="tr"><i style="width:94%"></i></span><span class="n">94</span></div><div class="sc"><span>Valuation</span><span class="tr"><i style="width:88%"></i></span><span class="n">88</span></div><div class="sc"><span>Growth</span><span class="tr"><i style="width:81%"></i></span><span class="n">81</span></div>' +
  '<h3 style="margin-top:6px">Cited sources</h3><div class="src"><span><b>[1]</b>Issuer annual report</span><span><b>[2]</b>Earnings call transcript</span></div></article>';
document.getElementById("app").innerHTML = dBg() + '<div class="page"><header class="top">' + BRAND + themeToggle() + "</header>" +
  '<main class="stage"><div class="fl">' + researchCard() + '</div><div class="fr">' + side2 + '</div>' +
  '<div class="center">' + formCard(false) + '<p class="promise">' + COPY.promise + "<small>" + COPY.partner + "</small></p></div></main>" +
  '<footer class="legal">' + COPY.advisory + "</footer></div>";
</script>
</body>
</html>
