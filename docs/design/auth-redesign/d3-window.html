<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D3 · The Window · trade-agent sign-in</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="d.css">
<style>
/* D3 · THE WINDOW. Mock, not the app. Show the real product: the Today screen (the scan bar and the top opportunity,
   in the app's own components) in a window on the left, the form card overlapping its edge on the right. The headline
   sits above the window. No icons in the fields. On a phone the window goes and the headline stays. */
.page { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: 28px clamp(20px, 4vw, 64px) 24px; overflow: hidden; }
.top { display: flex; align-items: center; justify-content: space-between; }
.main { width: 100%; max-width: 1340px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 460px; align-items: center; padding: 16px 0 20px; }
.l { position: relative; z-index: 1; display: grid; gap: 22px; }
.hero { margin: 0; font-size: clamp(30px, 3.1vw, 44px); line-height: 1.1; font-weight: 650; letter-spacing: -0.04em; max-width: 24ch; text-wrap: balance; }
.win { margin-right: -44px; border: 1px solid var(--line2); border-radius: 18px; overflow: hidden; background: var(--bg); box-shadow: var(--cardsh); }
.wbar { height: 42px; display: flex; align-items: center; gap: 7px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.wbar i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line2); }
.wbar span { margin-left: 10px; font-size: 12.5px; color: var(--muted); }
.wbody { padding: 22px 24px 26px; display: grid; gap: 14px; }
.wh h4 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.03em; } .wh p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.sb { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--cardsh); padding: 10px 14px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text2); }
.sb .ic { width: 34px; height: 34px; border-radius: 12px; background: var(--accent-wash); color: var(--accent); display: grid; place-items: center; flex: none; } .sb .ic svg { width: 16px; height: 16px; }
.sb b { color: var(--text); } .sb .t { flex: 1; min-width: 0; }
.sb .bt { height: 34px; padding: 0 14px; border: 1px solid var(--line2); border-radius: 999px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; white-space: nowrap; }
.tp { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); border-radius: 22px; border: 1px solid var(--line); box-shadow: var(--cardsh); padding: 20px; display: grid; gap: 14px; }
.tp .id { display: flex; align-items: center; gap: 14px; }
.tp .mono-c { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-wash); color: var(--accent); display: grid; place-items: center; font-weight: 650; flex: none; }
.tp h3 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; } .tp small { display: block; font-size: 13px; color: var(--muted); }
.tp .px { margin-left: auto; text-align: right; } .tp .px b { font-size: 26px; font-weight: 650; letter-spacing: -0.035em; }
.tp .row { display: flex; gap: 18px; align-items: center; }
.tp .ai { flex: 1; min-width: 0; }
.tp .go { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-solid); color: var(--on-accent); display: grid; place-items: center; flex: none; box-shadow: var(--btnsh); } .tp .go svg { width: 22px; height: 22px; }
.r { position: relative; z-index: 2; display: grid; justify-items: end; }
.legal { max-width: 1340px; width: 100%; margin: 0 auto; }
@media (max-width: 899px) {
  .main { grid-template-columns: minmax(0, 1fr); } .win { display: none; } .hero { font-size: 28px; max-width: none; }
  .l { gap: 0; margin-bottom: 24px; } .r { grid-template-columns: minmax(0, 1fr); justify-items: stretch; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script src="d.js"></script>
<script>
var go = svg('<path d="M5 12h14M13 6l6 6-6 6"/>');
var sparkI = svg('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/>');
var win = '<div class="win" role="img" aria-label="An illustrative view of the Today screen"><div class="wbar"><i></i><i></i><i></i><span>Today \u00b7 illustrative</span></div><div class="wbody">' +
  '<div class="wh"><h4>Today</h4><p>Your latest research ideas and what needs attention on your holdings.</p></div>' +
  '<div class="sb"><span class="ic">' + sparkI + '</span><span class="t"><b>Latest AI scan</b> \u00b7 Updated today \u00b7 8 opportunities \u00b7 2 set aside</span><span class="bt">Scan results</span><span class="bt">23 of 100 runs</span></div>' +
  '<article class="tp"><div class="id"><span class="mono-c">HS</span><div><h3>Halden Systems</h3><small>HLDN \u00b7 NASDAQ</small></div><div class="px"><b>USD 184.20</b><small>Scan quote \u00b7 20 Oct</small></div></div>' +
  '<div class="chips"><span class="chip">' + meterD(3) + 'High confidence</span><span class="chip">' + meterD(2) + 'Medium risk</span></div>' +
  '<div class="row"><div class="ai"><p>Recurring revenue priced below peers.</p><p class="m">' + sparkD + '<b>Why now.</b> Q3 results on 6 Nov</p><p class="m"><b>Risk to the thesis.</b> Top customers are 38% of revenue.</p><small>AI research summary \u00b7 2 cited sources</small></div><span class="go">' + go + '</span></div></article></div></div>';
document.getElementById("app").innerHTML = dBg() + '<div class="page"><header class="top">' + BRAND + themeToggle() + "</header>" +
  '<main class="main"><section class="l"><h2 class="hero">' + COPY.promise + '</h2>' + win + '</section><section class="r">' + formCard(false) + "</section></main>" +
  '<footer class="legal">' + COPY.advisory + "</footer></div>";
</script>
</body>
</html>
