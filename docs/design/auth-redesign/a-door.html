<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · The Door · trade-agent sign-in</title>
<link rel="stylesheet" href="common.css">
<style>
/* A · THE DOOR. Mock, not the app. One question at a time, no panel, light-weight display type.
   The reading order is the interface: a plumb line on the left fills as the person goes through.
   Form from the Soft system's own go button (the round cobalt arrow). Everything else is air. */
.page { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: 28px clamp(20px, 4vw, 56px) 28px; }
.top { display: flex; align-items: center; justify-content: space-between; }
.stage { position: relative; display: flex; align-items: center; padding: 40px 0 56px; }
.col { position: relative; width: min(100%, 620px); margin-left: clamp(0px, 9vw, 160px); padding-left: clamp(20px, 3vw, 44px); border-left: 1px solid var(--line2); }
.col::after { content: ""; position: absolute; left: -1px; top: 0; width: 2px; height: calc(var(--p, .5) * 100%); background: var(--accent); border-radius: 2px; transition: height .4s; }
h1 { margin: 0; font-weight: 300; font-size: clamp(40px, 5.4vw, 76px); line-height: 1.02; letter-spacing: -0.04em; text-wrap: balance; }
.sub { margin: 18px 0 0; max-width: 42ch; color: var(--muted); font-size: 17px; line-height: 1.5; text-wrap: pretty; }
form { margin: clamp(32px, 5vh, 56px) 0 0; display: grid; gap: 28px; }
.fld { display: grid; gap: 4px; }
.fld > label { font-size: 13px; color: var(--muted); font-weight: 500; }
.ln { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line2); transition: border-color .15s, box-shadow .15s; }
.ln:focus-within { border-color: var(--accent); box-shadow: 0 1px 0 0 var(--accent); }
.ln input { flex: 1; min-width: 0; height: 60px; padding: 0; border: 0; background: none; outline: 0; font-size: clamp(22px, 2.4vw, 30px); letter-spacing: -0.02em; font-weight: 400; }
.ln input::placeholder { color: color-mix(in srgb, var(--muted) 55%, transparent); }
.ln.quiet { border-bottom-style: dashed; }
.ln.quiet input { color: var(--muted); }
.ln.quiet svg { width: 18px; height: 18px; color: var(--muted); margin-right: 12px; }
.ln.bad { border-color: var(--err); box-shadow: 0 1px 0 0 var(--err); }
.hint { margin: 0; font-size: 14px; color: var(--muted); }
.hint.bad { color: var(--err); }
.msg { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.45; color: var(--text2); max-width: 46ch; }
.msg svg { width: 18px; height: 18px; margin-top: 2px; flex: none; color: var(--muted); }
.msg.err { color: var(--err); } .msg.err svg { color: var(--err); }
.msg.warn { color: var(--warn); } .msg.warn svg { color: var(--warn); }
.who { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 17px; color: var(--text2); }
.who a { font-size: 14px; color: var(--muted); }
.act { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; margin-top: 4px; }
.go { display: inline-flex; flex-direction: row-reverse; align-items: center; gap: 16px; border: 0; background: none; padding: 0; cursor: pointer; font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
.go .disc { width: 60px; height: 60px; border-radius: 50%; background: var(--accent-solid); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 10px 24px -10px var(--accent); transition: transform .2s; }
.go:hover .disc { transform: translateX(3px); }
.go .disc svg { width: 24px; height: 24px; }
.go[disabled] { opacity: .5; cursor: default; } .go[disabled] .disc { box-shadow: none; }
.alt { font-size: 15px; color: var(--muted); }
.ack { display: flex; gap: 14px; align-items: flex-start; font-size: 15px; color: var(--text2); line-height: 1.5; max-width: 46ch; cursor: pointer; }
.box { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line2); display: grid; place-items: center; flex: none; margin-top: 1px; color: var(--on-accent); }
.box.on { background: var(--accent-solid); border-color: var(--accent-solid); }
.box svg { width: 15px; height: 15px; stroke-width: 2.4; }
.promise { position: absolute; right: 0; bottom: 56px; width: min(380px, 30vw); }
.promise p { margin: 0; font-size: clamp(20px, 1.8vw, 26px); line-height: 1.3; font-weight: 300; letter-spacing: -0.025em; color: var(--text2); text-wrap: balance; }
.promise small { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); }
.foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 40px; align-items: end; font-size: 13px; color: var(--muted); }
.foot p { margin: 0; max-width: 56ch; text-wrap: pretty; }
.foot .r { text-align: right; display: grid; gap: 4px; }
.foot a { color: var(--muted); text-underline-offset: 3px; }
@media (max-width: 899px) {
  .promise { display: none; }
  .col { margin-left: 0; padding-left: 16px; }
  .stage { align-items: flex-start; padding-top: 28px; }
  .go { width: 100%; justify-content: space-between; background: var(--accent-solid); color: var(--on-accent); border-radius: 999px; height: 60px; padding: 0 6px 0 28px; flex-direction: row; }
  .go .disc { width: 48px; height: 48px; background: rgba(255, 255, 255, .18); box-shadow: none; }
  :root[data-theme="dark"] .go .disc { background: rgba(10, 21, 48, .16); }
  .act { gap: 18px; }
  .foot { grid-template-columns: 1fr; } .foot .r { text-align: left; }
}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script src="common.js"></script>
<script>
var field = (id, label, type, ph, extra) => '<div class="fld"><label for="' + id + '">' + label + '</label><div class="ln ' + ((extra && extra.cls) || "") + '">' + ((extra && extra.lead) || "") + '<input id="' + id + '" type="' + type + '" placeholder="' + (ph || "") + '" value="' + ((extra && extra.val) || "") + '"' + ((extra && extra.dis) ? " disabled" : "") + ' autocomplete="off">' + ((extra && extra.trail) || "") + '</div>' + ((extra && extra.hint) || "") + '</div>';
var go = (label, dis) => '<button class="go" type="submit"' + (dis ? " disabled" : "") + '><span>' + label + '</span><span class="disc">' + IC.arrow + '</span></button>';
// On a computer the label sits right of the disc; the markup order is label, disc, so reverse it there.
var S = {
  login: { p: .5, h: "Welcome back.", sub: "Sign in to your trade-agent account.", body: () => '<form>' + field("em", "Email", "email", "name@example.com", { val: P.has("typed") ? EMAIL : "" }) + '<div class="act">' + go("Continue") + '</div></form>' },
  login2: { p: 1, h: "Welcome back.", sub: "Sign in to your trade-agent account.", body: (err) => '<form><div class="who"><span>' + EMAIL + '</span><a href="#">Use a different email</a></div>' +
    field("pw", "Password", "password", "", { val: "correct horse", cls: err ? "bad" : "", trail: '<button class="eye" type="button" aria-label="Show password">' + IC.eye + '</button>' }) +
    (err ? '<p class="msg err" role="alert">' + IC.alert + COPY.loginErr + '</p>' : '') +
    '<div class="act">' + go("Sign in") + '<a class="alt" href="#">Forgot password?</a></div></form>' },
  invite: { p: .5, h: COPY.invite.title + ".", sub: COPY.invite.sub, body: () => '<form>' +
    field("ie", "Email", "email", "", { val: EMAIL, dis: 1, cls: "quiet", lead: IC.lock }) +
    field("p1", "Create password", "password", "", { val: "tidewater-9", hint: '<p class="hint">At least 8 characters.</p>' }) +
    field("p2", "Confirm password", "password", "", { val: "tidewater-9" }) +
    '<label class="ack"><span class="box on">' + IC.check + '</span><span>' + COPY.invite.ack + '</span></label>' +
    '<div class="act">' + go(COPY.invite.cta) + '</div></form>' },
  invalid: { p: 0, h: "This link has run out.", sub: "", body: () => '<p class="msg warn" role="alert" style="margin-top:28px">' + IC.alert + COPY.invalid + '</p>' },
  forgot: { p: .5, h: COPY.forgot.title + ".", sub: COPY.forgot.sub, body: () => '<form>' + field("fe", "Email", "email", "name@example.com", { val: EMAIL }) + '<div class="act">' + go(COPY.forgot.cta) + '</div></form>' },
  sent: { p: 1, h: "Check your email.", sub: "", body: () => '<p class="msg" role="status" style="margin-top:28px">' + IC.mail + COPY.sent + '</p>' },
  reset: { p: .5, h: COPY.reset.title + ".", sub: EMAIL, body: () => '<form>' + field("n1", "New password", "password", "", { val: "tidewater-9" }) + field("n2", "Confirm password", "password", "", { val: "tidewater-9" }) + '<div class="act">' + go(COPY.reset.cta) + '</div></form>' },
};
var key = SCREEN, err = false;
if (key === "login2err") { key = "login2"; err = true; }
var s = S[key] || S.login;
document.getElementById("app").innerHTML =
  '<header class="top"><a class="brand" href="#"><img src="../../../frontend/public/los_trading_hermanos_logo.svg" alt=""><span>trade-agent</span></a>' + themeToggle() + '</header>' +
  '<main class="stage"><div class="col" style="--p:' + s.p + '"><h1>' + s.h + '</h1>' + (s.sub ? '<p class="sub">' + s.sub + '</p>' : '') + s.body(err) + '</div>' +
  '<aside class="promise"><p>' + COPY.promise + '</p><small>' + COPY.partner + '</small></aside></main>' +
  '<footer class="foot"><p>' + (key === "login" || key === "login2" ? COPY.invitationOnly : "") + '</p><div class="r"><span>' + COPY.advisory + '</span><a href="#">' + COPY.logoDev + '</a></div></footer>';
</script>
</body>
</html>
