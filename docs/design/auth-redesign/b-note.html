<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · The Note · trade-agent sign-in</title>
<link rel="stylesheet" href="common.css">
<style>
/* B · THE NOTE. Mock, not the app. The first page of a research note: a masthead between two ink rules, the
   promise set as the headline, the form as a ruled column on the right. Display type pressed hard against small
   running text; ink and paper, cobalt only for the one live thing. Light and dark share the same grid. */
:root { --ink: var(--text); --rule: var(--text); }
.sheet { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: 0 clamp(20px, 3.2vw, 48px); max-width: 1560px; margin: 0 auto; }
.mast { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 18px 0 16px; border-bottom: 2px solid var(--rule); }
.mast .mid { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.mast .r { display: flex; align-items: center; gap: 18px; justify-content: flex-end; font-size: 12px; color: var(--muted); }
.mast .r span { white-space: nowrap; }
.body { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); }
.head { padding: clamp(32px, 7vh, 88px) clamp(0px, 3vw, 56px) 40px 0; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; }
.head h1 { margin: 0; font-weight: 650; font-size: clamp(40px, 5.5vw, 92px); line-height: .98; letter-spacing: -0.055em; text-wrap: balance; }
.head h1 span { display: block; }
.head h1 span:last-child { color: var(--accent); }
.deck { display: grid; grid-template-columns: minmax(0, 36ch) minmax(0, 1fr); gap: 24px; align-items: end; }
.deck p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--text2); text-wrap: pretty; }
.deck .no { font-size: 13px; color: var(--muted); }
.form { border-left: 1px solid var(--line2); padding: clamp(32px, 7vh, 88px) 0 40px clamp(20px, 3vw, 48px); display: flex; flex-direction: column; }
.form h2 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.1; }
.form .sub { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 38ch; }
form { margin-top: 32px; display: grid; gap: 0; border-top: 1px solid var(--rule); }
.row { border-bottom: 1px solid var(--line2); padding: 10px 0 8px; display: grid; gap: 2px; }
.row:focus-within { box-shadow: inset 0 -2px 0 var(--accent); border-bottom-color: var(--accent); }
.row label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.row .in { display: flex; align-items: center; gap: 8px; }
.row input { flex: 1; min-width: 0; height: 32px; border: 0; background: none; outline: 0; padding: 0; font-size: 17px; letter-spacing: -0.01em; }
.row.quiet input { color: var(--muted); }
.row.bad { border-bottom-color: var(--err); box-shadow: inset 0 -2px 0 var(--err); }
.row .eye { margin-right: -10px; }
.row .hint { font-size: 12px; color: var(--muted); }
.row .hint.bad { color: var(--err); }
.msg { margin: 16px 0 0; display: flex; gap: 10px; font-size: 14px; line-height: 1.45; color: var(--text2); text-wrap: pretty; }
.msg svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--muted); }
.msg.err { color: var(--err); } .msg.err svg { color: var(--err); }
.msg.warn { color: var(--warn); } .msg.warn svg { color: var(--warn); }
.cta { margin-top: 24px; width: 100%; height: 52px; border: 0; border-radius: 6px; background: var(--text); color: var(--bg); font-weight: 650; font-size: 16px; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; cursor: pointer; }
.cta svg { width: 20px; height: 20px; }
.cta:hover { background: var(--accent-solid); color: var(--on-accent); }
.links { margin-top: 18px; display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.links a { color: var(--text2); text-underline-offset: 3px; }
.ack { margin-top: 18px; display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.5; color: var(--text2); cursor: pointer; }
.box { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--text); display: grid; place-items: center; flex: none; margin-top: 1px; color: var(--bg); }
.box.on { background: var(--text); }
.box svg { width: 14px; height: 14px; stroke-width: 2.6; }
.invite-only { margin-top: auto; padding-top: 40px; font-size: 13px; line-height: 1.5; color: var(--muted); max-width: 40ch; }
.foot { border-top: 1px solid var(--line2); padding: 14px 0 20px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.foot a { color: var(--muted); text-underline-offset: 3px; }
@media (max-width: 899px) {
  .mast { grid-template-columns: 1fr auto; } .mast .mid, .mast .r span { display: none; }
  .body { grid-template-columns: minmax(0, 1fr); }
  .head { padding: 28px 0 8px; gap: 24px; } .head h1 { font-size: clamp(34px, 11vw, 56px); }
  .deck { grid-template-columns: 1fr; gap: 6px; }
  .form { border-left: 0; padding: 24px 0 24px; }
  .invite-only { padding-top: 28px; }
}
</style>
</head>
<body>
<div class="sheet" id="app"></div>
<script src="common.js"></script>
<script>
var row = (id, label, type, o) => { o = o || {}; return '<div class="row ' + (o.cls || "") + '"><label for="' + id + '">' + label + '</label><div class="in"><input id="' + id + '" type="' + type + '" value="' + (o.val || "") + '" placeholder="' + (o.ph || "") + '"' + (o.dis ? " disabled" : "") + ' autocomplete="off">' + (o.trail || "") + "</div>" + (o.hint || "") + "</div>"; };
var cta = (t) => '<button class="cta" type="submit"><span>' + t + "</span>" + IC.arrow + "</button>";
var S = {
  login: { h: "Sign in", sub: "to your trade-agent account", note: 1, body: () => "<form>" + row("em", "Email", "email", { val: P.has("typed") ? EMAIL : "", ph: "name@example.com" }) + row("pw", "Password", "password", { val: P.has("typed") ? "correct horse" : "", trail: '<button class="eye" type="button" aria-label="Show password">' + IC.eye + "</button>" }) + "</form>" + '<div></div>', after: (e) => (e ? '<p class="msg err" role="alert">' + IC.alert + COPY.loginErr + "</p>" : "") + cta("Sign in") + '<div class="links"><a href="#">Forgot password?</a></div>' },
  invite: { h: COPY.invite.title, sub: COPY.invite.sub, body: () => "<form>" + row("ie", "Email", "email", { val: EMAIL, dis: 1, cls: "quiet" }) + row("p1", "Create password", "password", { val: "tidewater-9", hint: '<span class="hint">At least 8 characters.</span>' }) + row("p2", "Confirm password", "password", { val: "tidewater-9" }) + "</form>", after: () => '<label class="ack"><span class="box on">' + IC.check + "</span><span>" + COPY.invite.ack + "</span></label>" + cta(COPY.invite.cta) },
  invalid: { h: "Link not valid", sub: "", body: () => "", after: () => '<p class="msg warn" role="alert">' + IC.alert + COPY.invalid + "</p>" },
  forgot: { h: COPY.forgot.title, sub: COPY.forgot.sub, body: () => "<form>" + row("fe", "Email", "email", { val: EMAIL }) + "</form>", after: () => cta(COPY.forgot.cta) },
  sent: { h: "Check your email", sub: "", body: () => "", after: () => '<p class="msg" role="status">' + IC.mail + COPY.sent + "</p>" },
  reset: { h: COPY.reset.title, sub: EMAIL, body: () => "<form>" + row("n1", "New password", "password", { val: "tidewater-9" }) + row("n2", "Confirm password", "password", { val: "tidewater-9" }) + "</form>", after: () => cta(COPY.reset.cta) },
};
var key = SCREEN, err = false;
if (key === "loginerr") { key = "login"; err = true; P.set("typed", "1"); }
var s = S[key] || S.login;
var today = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
document.getElementById("app").innerHTML =
  '<header class="mast"><a class="brand" href="#"><img src="../../../frontend/public/los_trading_hermanos_logo.svg" alt=""><span>trade-agent</span></a><span class="mid mono">Advisory research · By invitation</span><div class="r"><span class="mono">' + today + "</span>" + themeToggle() + "</div></header>" +
  '<div class="body"><section class="head"><h1>' + COPY.promiseLines.map((l) => "<span>" + l + "</span>").join("") + '</h1><div class="deck"><p>' + COPY.partner + '</p><p class="no"></p></div></section>' +
  '<section class="form"><h2>' + s.h + "</h2>" + (s.sub ? '<p class="sub">' + s.sub + "</p>" : "") + (key === "invalid" || key === "sent" ? "" : "") + s.body() + s.after(err) +
  (key === "login" ? '<p class="invite-only">' + COPY.invitationOnly + "</p>" : "") + "</section></div>" +
  '<footer class="foot"><span>' + COPY.advisory + '</span><a href="#">' + COPY.logoDev + "</a></footer>";
</script>
</body>
</html>
