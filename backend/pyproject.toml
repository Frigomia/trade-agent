[project]
name = "trade-agent-backend"
version = "0.1.0"
description = "Advisory-only trading agent backend — FastAPI + LangGraph + MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "langgraph",
    "anthropic",
    "yfinance",
    "redis",
    "psycopg[binary]",
    "pgvector",
    "httpx",
    "pyjwt[crypto]>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pip-audit",
    "bandit",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true
